name: shadow-ci

# Guards every push/PR: lint (ruff), types (pyright), and tests (pytest —
# golden eval + connector interface). The test lane is fully offline: no AWS,
# Box, or source credentials required.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # runtime deps the modules import at load + dev tools
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (pyright)
        run: pyright

      - name: Tests (pytest — golden eval + interface)
        run: pytest
