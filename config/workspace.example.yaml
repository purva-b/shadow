# Shadow workspace config — this is what makes Shadow team-agnostic.
# Copy to config/workspace.yaml and edit per team. Nothing here is Payments-specific.

workspace:
  name: "Payments"            # display name only
  canonical_domain: "acme.com"

# Components are WORKSPACE-DEFINED tags, not a fixed enum. A different team
# would list its own (e.g. billing, auth, search). Ingest tags records with
# these; retrieval and who-to-ask route on them.
components:
  - retry-service
  - payments-api
  - ledger
  - gateway-client
  - checkout

# Which connectors are live for this workspace. A connector not listed here is
# never loaded, even if its file exists. Adding a source = write the connector
# file + add its name here.
enabled_connectors:
  - box
  # - slack
  # - github
  # - confluence
  # - calendar

# Identity map: one human, many handles. Resolves Box/Slack/GitHub/calendar
# handles to one canonical principal so permissions and people-cards stay
# correct across every source. Replaces the hardcoded NAME_TO_EMAIL dict.
identities:
  - canonical: priya@acme.com
    box: priya@payments.example
    github: pnair
    aliases: ["Priya Nair", "Priya"]
  - canonical: dana@acme.com
    box: dana@payments.example
    aliases: ["Dana Kim", "Dana"]

# Per-connector secrets are read from env (never committed). The connector's
# subscribe() names which env var holds its webhook secret.
# e.g. BOX_WEBHOOK_KEY_1, SLACK_SIGNING_SECRET, GITHUB_WEBHOOK_SECRET
